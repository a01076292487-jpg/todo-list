<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Todo List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .todo-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .todo-item:hover {
            transform: translateX(5px);
        }
        .completed {
            text-decoration: line-through;
            opacity: 0.6;
        }
        /* Custom Checkbox Style */
        .custom-checkbox:checked + span {
            text-decoration: line-through;
            color: #9ca3af;
        }
    </style>
</head>
<body class="py-10 px-4">

    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden">
        <div class="p-8">
            <header class="mb-8">
                <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">My Tasks</h1>
                <p id="current-date" class="text-sm text-gray-500 font-medium mt-1 uppercase tracking-wider"></p>
            </header>

            <!-- Input Section -->
            <div class="relative mb-8">
                <input type="text" id="todo-input" 
                    class="w-full pl-4 pr-12 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none text-gray-700 placeholder-gray-400 shadow-sm"
                    placeholder="내일 할 일을 입력하세요...">
                <button id="add-btn" class="absolute right-2 top-2 bottom-2 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition-colors shadow-lg flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </button>
            </div>

            <!-- Filters -->
            <div class="flex space-x-2 mb-6 text-sm font-semibold">
                <button onclick="filterTodos('all')" id="filter-all" class="px-4 py-2 rounded-full bg-blue-100 text-blue-700 hover:bg-blue-200 transition-colors">전체</button>
                <button onclick="filterTodos('active')" id="filter-active" class="px-4 py-2 rounded-full text-gray-500 hover:bg-gray-100 transition-colors">진행중</button>
                <button onclick="filterTodos('completed')" id="filter-completed" class="px-4 py-2 rounded-full text-gray-500 hover:bg-gray-100 transition-colors">완료</button>
            </div>

            <ul id="todo-list" class="space-y-3">
                <!-- Todo items will be injected here -->
            </ul>

            <!-- Footer Stats -->
            <footer class="mt-8 pt-6 border-t border-gray-100 flex justify-between items-center text-xs text-gray-400 font-medium">
                <span id="items-left">0 items left</span>
                <button onclick="clearCompleted()" class="hover:text-red-500 transition-colors uppercase tracking-widest">Clear Completed</button>
            </footer>
        </div>
    </div>

    <script>
        /* Initial State */
        let todos = JSON.parse(localStorage.getItem('todos')) || [];
        let currentFilter = 'all';

        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const itemsLeft = document.getElementById('items-left');
        const dateDisplay = document.getElementById('current-date');

        
        // Date Setup
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        dateDisplay.innerText = new Date().toLocaleDateString('ko-KR', options);

        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
            renderTodos();
        }

        function addTodo() {
            const text = todoInput.value.trim();
            if (text === "") return;

            const newTodo = {
                id: Date.now(),
                text: text,
                completed: false
            };

            todos.unshift(newTodo);
            todoInput.value = "";
            saveTodos();
        }

        function toggleTodo(id) {
            todos = todos.map(todo => 
                todo.id === id ? { ...todo, completed: !todo.completed } : todo
            );
            saveTodos();
        }

        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            saveTodos();
        }

        function clearCompleted() {
            todos = todos.filter(todo => !todo.completed);
            saveTodos();
        }

        function filterTodos(filter) {
            currentFilter = filter;
            
            // Update UI filter buttons
            ['all', 'active', 'completed'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.classList.add('bg-blue-100', 'text-blue-700');
                    btn.classList.remove('text-gray-500');
                } else {
                    btn.classList.remove('bg-blue-100', 'text-blue-700');
                    btn.classList.add('text-gray-500');
                }
            });
            
            renderTodos();
        }

        function renderTodos() {
            todoList.innerHTML = '';
            
            const filteredTodos = todos.filter(todo => {
                if (currentFilter === 'active') return !todo.completed;
                if (currentFilter === 'completed') return todo.completed;
                return true;
            });

            if (filteredTodos.length === 0) {
                todoList.innerHTML = `
                    <li class="py-10 text-center text-gray-400 italic">
                        할 일이 없습니다.
                    </li>
                `;
            }

            filteredTodos.forEach(todo => {
                const li = document.createElement('li');
                li.className = 'todo-item flex items-center justify-between p-4 bg-gray-50 rounded-2xl group border border-transparent hover:border-blue-100 hover:bg-blue-50/30';
                
                li.innerHTML = `
                    <div class="flex items-center space-x-4 flex-1 cursor-pointer" onclick="toggleTodo(${todo.id})">
                        <div class="relative flex items-center justify-center">
                            <input type="checkbox" ${todo.completed ? 'checked' : ''} 
                                class="w-6 h-6 rounded-full border-2 border-blue-400 text-blue-600 focus:ring-0 cursor-pointer transition-all">
                        </div>
                        <span class="text-gray-700 font-medium ${todo.completed ? 'completed' : ''}">${todo.text}</span>
                    </div>
                    <button onclick="deleteTodo(${todo.id})" class="opacity-0 group-hover:opacity-100 p-2 text-gray-400 hover:text-red-500 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </button>
                `;
                todoList.appendChild(li);
            });

            // Update footer info
            const leftCount = todos.filter(todo => !todo.completed).length;
            itemsLeft.innerText = `${leftCount} items left`;
        }

        document.getElementById('add-btn').addEventListener('click', addTodo);
        
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        // Initial render
        renderTodos();
    </script>
</body>
</html>
